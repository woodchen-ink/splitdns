name: 发版

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - id: ver
        # tag 触发时用 tag 名, 手动触发时用短 commit, 保证产物名永远能对上一次构建
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-build

      - name: 安装 NSIS
        run: |
          choco install nsis -y --no-progress
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: 构建绿色版与安装版
        working-directory: desktop
        # 不能带 -s: desktop/frontend/ 不进仓库, 干净检出时得靠 wails 跑 frontend:build 生成,
        # 跳过的话 wails 会塞一个占位 index.html 进去, 编译照样通过但装出来是个空壳
        # -webview2 embed: 目标机器没装 WebView2 运行时也能自己拉起来装, 不能假设环境
        # -skipbindings: 前端不用 Wails 的 JS 绑定, 所有交互都走 /api
        # -nsis: 顺带出一个安装版, 与绿色版是同一份二进制
        # -ldflags 注入版本号: 自动更新靠它判断新旧, 不注入就是 dev, 永远不检查更新
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # 安装器的 DisplayVersion / 文件版本取自 wails.json, 只认纯数字的 x.y.z (手动触发的 dev-xxx 不改)
          if ($env:VERSION -match '^v(\d+\.\d+\.\d+)$') {
            $cfg = Get-Content wails.json -Raw | ConvertFrom-Json
            $cfg.info.productVersion = $Matches[1]
            $cfg | ConvertTo-Json -Depth 10 | Set-Content wails.json -Encoding utf8
          }
          wails build -platform windows/amd64 -webview2 embed -skipbindings -nsis -ldflags "-X main.version=$env:VERSION"

      - name: 打包
        working-directory: desktop/build/bin
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          Copy-Item ../../../README.md .
          Compress-Archive -Path splitdns.exe,README.md -DestinationPath "splitdns-$env:VERSION-windows-amd64-portable.zip"
          Move-Item splitdns-amd64-installer.exe "splitdns-$env:VERSION-windows-amd64-installer.exe"

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            desktop/build/bin/*-portable.zip
            desktop/build/bin/*-installer.exe

  macos:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-build

      - name: 构建 universal .app
        working-directory: desktop
        # darwin 端要链 WebKit, 只能在 macOS 上编译, 交叉编译不可行
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: wails build -platform darwin/universal -skipbindings -ldflags "-X main.version=$VERSION"

      - name: 打包
        working-directory: desktop/build/bin
        env:
          VERSION: ${{ needs.version.outputs.version }}
        # 用 ditto 而不是 zip: .app 是目录, 里面有符号链接与可执行位, zip 会丢
        run: ditto -c -k --sequesterRsrc --keepParent splitdns.app "splitdns-$VERSION-macos-universal.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: desktop/build/bin/*-macos-universal.zip

  release:
    needs: [version, windows, macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache-dependency-path: server/go.sum

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # 给全部产物出 SHA256SUMS + ed25519 签名, 客户端自动更新只认签名对得上的包。
      # 工具会拿仓库里的公钥回验: secret 缺失或与公钥不是一对时这里就失败, 不发出装不上的版本
      - name: 签名
        working-directory: server
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: go run ./tools/updatesign -dir ../dist -pub ../desktop/updatekey.pub

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ### Windows

            两个包用的是同一份二进制, 数据都在 `%LOCALAPPDATA%\CZL\splitdns\data`, 共用同一份:

            | | 装在哪 | 说明 |
            |---|---|---|
            | **安装版** `*-installer.exe` | `%LOCALAPPDATA%\CZL\splitdns` | 按用户安装, 不要管理员权限; 升级重装不动数据 |
            | **绿色版** `*-portable.zip` | 解压到哪都行 | 不想跑安装器时用 |

            旧版本的数据 (`%APPDATA%\splitdns` 或绿色版 exe 同级 `data\`) 首次启动自动搬过来。
            装过旧版安装版 (Program Files) 的, 新安装器会提示先运行它的卸载程序。

            机器上没有 WebView2 会自己拉起来装。

            ### macOS

            `*-macos-universal.zip` 解压出 `splitdns.app`, Intel 与 Apple Silicon 通用。
            数据在 `~/Library/Application Support/CZL/splitdns`, 旧版目录里的数据首次启动自动搬过来。

            **没有做签名和公证**, 首次打开会被 Gatekeeper 拦下。两种放行方式任选:

            - 右键点 `splitdns.app` → 打开 → 在弹窗里再点一次「打开」
            - 或者终端跑: `xattr -dr com.apple.quarantine /Applications/splitdns.app`

            ### 升级

            程序会自动检查新版本: Windows 在顶栏点「更新」即可下载安装并重启 (安装版与绿色版都支持);
            macOS 会提示新版本并打开下载页。也可以手动覆盖安装, 数据不受影响。

            `SHA256SUMS` 与 `SHA256SUMS.sig` 是自动更新用的校验文件, 手动下载可以忽略。
