name: 发版

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - id: ver
        # tag 触发时用 tag 名, 手动触发时用短 commit, 保证产物名永远能对上一次构建
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-build

      - name: 安装 NSIS
        run: |
          choco install nsis -y --no-progress
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: 构建绿色版与安装版
        working-directory: desktop
        # 不能带 -s: desktop/frontend/ 不进仓库, 干净检出时得靠 wails 跑 frontend:build 生成,
        # 跳过的话 wails 会塞一个占位 index.html 进去, 编译照样通过但装出来是个空壳
        # -webview2 embed: 目标机器没装 WebView2 运行时也能自己拉起来装, 不能假设环境
        # -skipbindings: 前端不用 Wails 的 JS 绑定, 所有交互都走 /api
        # -nsis: 顺带出一个安装版, 与绿色版是同一份二进制
        # -ldflags 注入版本号: 自动更新靠它判断新旧, 不注入就是 dev, 永远不检查更新
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # 安装器的 DisplayVersion / 文件版本取自 wails.json, 只认纯数字的 x.y.z (手动触发的 dev-xxx 不改)
          if ($env:VERSION -match '^v(\d+\.\d+\.\d+)$') {
            $cfg = Get-Content wails.json -Raw | ConvertFrom-Json
            $cfg.info.productVersion = $Matches[1]
            $cfg | ConvertTo-Json -Depth 10 | Set-Content wails.json -Encoding utf8
          }
          wails build -platform windows/amd64 -webview2 embed -skipbindings -nsis -ldflags "-X main.version=$env:VERSION"

      - name: 打包
        working-directory: desktop/build/bin
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          Copy-Item ../../../README.md .
          Compress-Archive -Path splitdns.exe,README.md -DestinationPath "splitdns-$env:VERSION-windows-amd64-portable.zip"
          Move-Item splitdns-amd64-installer.exe "splitdns-$env:VERSION-windows-amd64-installer.exe"

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            desktop/build/bin/*-portable.zip
            desktop/build/bin/*-installer.exe

  macos:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-build

      - name: 构建 universal .app
        working-directory: desktop
        # darwin 端要链 WebKit, 只能在 macOS 上编译, 交叉编译不可行
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: wails build -platform darwin/universal -skipbindings -ldflags "-X main.version=$VERSION"

      # 有 Developer ID 证书与公证 Key (secrets CZL_MACOS_* / CZL_APPLE_*) 时: hardened runtime 由内向外签名 .app,
      # 打 DMG 并签名, 提交公证后把票据钉到 DMG 与 .app 上, 再用钉过票据的 .app 打 zip (离线也能过 Gatekeeper)。
      # secrets 不全 (fork 仓库等) 时退回 ad-hoc 签名: Apple Silicon 不运行无签名代码, lipo 合并会让链接器给的签名失效;
      # 这样的包首次打开要右键放行。
      # 用 ditto 而不是 zip: .app 是目录, 里面有符号链接与可执行位, zip 会丢
      - name: 签名、公证与打包
        working-directory: desktop/build/bin
        env:
          VERSION: ${{ needs.version.outputs.version }}
          CERT_P12_BASE64: ${{ secrets.CZL_MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.CZL_MACOS_CERT_PASSWORD }}
          API_KEY_P8_BASE64: ${{ secrets.CZL_APPLE_API_KEY_P8_BASE64 }}
          API_KEY_ID: ${{ secrets.CZL_APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.CZL_APPLE_API_ISSUER_ID }}
          TEAM_ID: ${{ secrets.CZL_APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          app=splitdns.app
          dmg="splitdns-$VERSION-macos-universal.dmg"
          zip="splitdns-$VERSION-macos-universal.zip"
          plutil -lint "$app/Contents/Info.plist"

          make_dmg() {
            rm -rf dmg && mkdir dmg && ditto "$app" "dmg/$app" && ln -s /Applications dmg/Applications
            hdiutil create -volname splitdns -srcfolder dmg -ov -format UDZO "$dmg"
            rm -rf dmg
          }

          if [ -z "$CERT_P12_BASE64" ] || [ -z "$CERT_PASSWORD" ] || [ -z "$API_KEY_P8_BASE64" ] \
             || [ -z "$API_KEY_ID" ] || [ -z "$API_ISSUER_ID" ] || [ -z "$TEAM_ID" ]; then
            echo "::warning::缺少 macOS 签名/公证 secrets, 改用 ad-hoc 签名, 用户首次打开需右键放行"
            codesign --force --deep --sign - "$app"
            codesign --verify --deep --strict "$app"
            make_dmg
            ditto -c -k --sequesterRsrc --keepParent "$app" "$zip"
            exit 0
          fi

          # 证书导入一次性钥匙串, 清理在下一步 (always) 里做
          keychain="$RUNNER_TEMP/signing.keychain-db"
          kc_pass=$(openssl rand -hex 24)
          security create-keychain -p "$kc_pass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$kc_pass" "$keychain"
          echo "$CERT_P12_BASE64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CERT_PASSWORD" -f pkcs12 -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kc_pass" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$keychain" \
            | grep "Developer ID Application" | grep "($TEAM_ID)" | head -n1 | awk '{print $2}')
          [ -n "$identity" ] || { echo "::error::钥匙串里没有 Team $TEAM_ID 的 Developer ID Application 证书"; exit 1; }

          # 由内向外: 先签包内其他 Mach-O (目前没有, 以后加 helper / dylib 时自动覆盖), 最后签 .app 本体
          entitlements="$GITHUB_WORKSPACE/desktop/build/darwin/entitlements.plist"
          main_exe="$app/Contents/MacOS/$(plutil -extract CFBundleExecutable raw "$app/Contents/Info.plist")"
          sign() { codesign --force --options runtime --timestamp --entitlements "$entitlements" --sign "$identity" "$@"; }
          find "$app/Contents" -type f ! -path "$main_exe" -print0 | while IFS= read -r -d '' f; do
            if file -b "$f" | grep -q 'Mach-O'; then sign "$f"; fi
          done
          sign "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -d --verbose=2 "$app" 2>&1 | grep -E 'Authority|TeamIdentifier|flags'

          make_dmg
          codesign --force --timestamp --sign "$identity" "$dmg"

          # 公证 DMG (里面的 .app 一起登记), 没通过时打印公证日志再失败。
          # Apple 排队有时超过 30 分钟, 等待上限放宽到 2 小时
          echo "$API_KEY_P8_BASE64" | base64 -d > "$RUNNER_TEMP/AuthKey.p8"
          notary=(--key "$RUNNER_TEMP/AuthKey.p8" --key-id "$API_KEY_ID" --issuer "$API_ISSUER_ID")
          xcrun notarytool submit "$dmg" "${notary[@]}" --wait --timeout 2h --output-format json | tee notary.json
          status=$(plutil -extract status raw notary.json)
          if [ "$status" != "Accepted" ]; then
            xcrun notarytool log "$(plutil -extract id raw notary.json)" "${notary[@]}" || true
            echo "::error::公证未通过: $status"; exit 1
          fi
          rm -f "$RUNNER_TEMP/AuthKey.p8" notary.json

          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          spctl -a -vvv -t install "$dmg"
          xcrun stapler staple "$app"
          spctl -a -vvv -t exec "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$zip"

      - name: 清理签名钥匙串
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/AuthKey.p8"

      - uses: actions/upload-artifact@v7
        with:
          name: macos
          if-no-files-found: error
          path: |
            desktop/build/bin/*-macos-universal.dmg
            desktop/build/bin/*-macos-universal.zip

  release:
    needs: [version, windows, macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache-dependency-path: server/go.sum

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # 给全部产物出 SHA256SUMS + ed25519 签名, 客户端自动更新只认签名对得上的包。
      # 工具会拿仓库里的公钥回验: secret 缺失或与公钥不是一对时这里就失败, 不发出装不上的版本
      - name: 签名
        working-directory: server
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: go run ./tools/updatesign -dir ../dist -pub ../desktop/updatekey.pub

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ### Windows

            两个包用的是同一份二进制, 数据都在 `%LOCALAPPDATA%\CZL\splitdns\data`, 共用同一份:

            | | 装在哪 | 说明 |
            |---|---|---|
            | **安装版** `*-installer.exe` | `%LOCALAPPDATA%\CZL\splitdns` | 按用户安装, 不要管理员权限; 升级重装不动数据 |
            | **绿色版** `*-portable.zip` | 解压到哪都行 | 不想跑安装器时用 |

            旧版本的数据 (`%APPDATA%\splitdns` 或绿色版 exe 同级 `data\`) 首次启动自动搬过来。
            装过旧版安装版 (Program Files) 的, 新安装器会提示先运行它的卸载程序。

            机器上没有 WebView2 会自己拉起来装。

            ### macOS

            打开 `*-macos-universal.dmg`, 把 `splitdns.app` 拖进「应用程序」即可; `*-macos-universal.zip` 是同一个 .app 的压缩包。
            Intel 与 Apple Silicon 通用, 已用 Developer ID 签名并经 Apple 公证, 双击直接打开。
            数据在 `~/Library/Application Support/CZL/splitdns`, 旧版目录里的数据首次启动自动搬过来。

            ### 升级

            程序会自动检查新版本: Windows 在顶栏点「更新」即可下载安装并重启 (安装版与绿色版都支持);
            macOS 会提示新版本并打开下载页。也可以手动覆盖安装, 数据不受影响。

            `SHA256SUMS` 与 `SHA256SUMS.sig` 是自动更新用的校验文件, 手动下载可以忽略。
