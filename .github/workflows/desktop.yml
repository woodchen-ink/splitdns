name: 桌面版构建

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          # 两个模块各有自己的 go.sum, 都要参与缓存 key
          cache-dependency-path: |
            server/go.sum
            desktop/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装 wails 与 NSIS
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
          choco install nsis -y --no-progress
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: 构建绿色版与安装版
        working-directory: desktop
        # -webview2 embed: 目标机器没装 WebView2 运行时也能自己拉起来装, 不能假设环境
        # -skipbindings: 前端不用 Wails 的 JS 绑定, 所有交互都走 /api
        # -nsis: 顺带出一个安装版, 与绿色版是同一份二进制
        run: wails build -platform windows/amd64 -webview2 embed -skipbindings -s -nsis

      - name: 打包绿色版
        working-directory: desktop/build/bin
        run: |
          Copy-Item ../../../README.md .
          Compress-Archive -Path splitdns.exe,README.md -DestinationPath splitdns-portable-windows-amd64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: splitdns-windows-amd64
          path: |
            desktop/build/bin/splitdns-portable-windows-amd64.zip
            desktop/build/bin/splitdns-amd64-installer.exe

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/build/bin/splitdns-portable-windows-amd64.zip
            desktop/build/bin/splitdns-amd64-installer.exe
          body: |
            两个版本用的是同一份二进制, 差别只在数据放哪:

            - **安装版** `splitdns-amd64-installer.exe` — 装进 Program Files,
              数据存在 `%APPDATA%\splitdns`, 升级重装不会动它
            - **绿色版** `splitdns-portable-windows-amd64.zip` — 解压即用,
              数据存在 exe 同级的 `data/`, 整个文件夹拷走就带走全部配置和密钥

            都不用先装运行时: 机器上没有 WebView2 会自己拉起来装。
