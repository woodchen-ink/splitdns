name: 桌面版构建

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          # 两个模块各有自己的 go.sum, 都要参与缓存 key
          cache-dependency-path: |
            server/go.sum
            desktop/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装 wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: 构建绿色版
        working-directory: desktop
        # -webview2 embed: 目标机器没装 WebView2 运行时也能自己拉起来装, 绿色版不能假设环境
        # -skipbindings: 前端不用 Wails 的 JS 绑定, 所有交互都走 /api
        run: wails build -platform windows/amd64 -webview2 embed -skipbindings -s -o splitdns.exe

      - name: 打包
        working-directory: desktop/build/bin
        run: |
          Copy-Item ../../../README.md .
          Compress-Archive -Path splitdns.exe,README.md -DestinationPath splitdns-windows-amd64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: splitdns-windows-amd64
          path: desktop/build/bin/splitdns-windows-amd64.zip

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/build/bin/splitdns-windows-amd64.zip
          body: |
            解压即用的绿色版, 不需要安装。

            数据存在 exe 同级的 `data/` 目录里 —— 整个文件夹拷走就能带走全部配置和密钥。
            exe 放在只读位置 (比如 Program Files) 时会自动回退到用户配置目录。
